<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="yandex-verification" content="d9b939858d4fa55d" />
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<link rel="shortcut icon" href="/img/favicon.ico">

	<title>FIGMA IMPORTER</title>

	<!--
		OAuth redirect target for the Unity Figma Importer tool.
		This URL is registered as the redirect URI in the Figma application,
		so the path /figmaImporter.html must not change.
		Kept as a plain static file so it survives site rebuilds.
	-->

	<style>
		body {
			margin: 0;
			padding: 2rem 1rem;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
			font-size: 16px;
			line-height: 1.6;
			color: #1c1e21;
			background: #fff;
		}
		main { max-width: 640px; margin: 0 auto; }
		h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
		strong {
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			word-break: break-all;
		}
		p { margin: 0 0 .75rem; }
		.hint { margin-top: 1.5rem; color: #545454; }
		@media (prefers-color-scheme: dark) {
			body { color: #e3e3e3; background: #1b1b1d; }
			.hint { color: #a5a5a5; }
		}
	</style>
</head>
<script type="text/javascript">
	function getParameterByName(name) {
		name = name.replace(/[\[]/, "\\\[").replace(/[\]]/, "\\\]");
		var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
			results = regex.exec(location.search);
		return results == null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
	}

	function fillParameters(){
		document.getElementById("ClientCode").innerHTML = getParameterByName("code");
		document.getElementById("State").innerHTML = getParameterByName("state");
	}
</script>
<body onload = "fillParameters()">
	<main>
		<h1>FIGMA IMPORTER</h1>
		<p>Your ClientCode is: <strong id = "ClientCode"></strong></p>
		<p>Your State is: <strong id = "State"></strong></p>
		<p class="hint">Copy them into the fields in Unity's figma importer window. And press "GetToken" button.</p>
	</main>
</body>
</html>
